name: Job Hunter Bot - Ricerca Giornaliera

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug - Check secrets availability
        run: |
          echo "TELEGRAM_BOT_TOKEN set: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && 'YES' || 'NO' }}"
          echo "TELEGRAM_CHAT_ID set: ${{ secrets.TELEGRAM_CHAT_ID != '' && 'YES' || 'NO' }}"
          echo "OPENAI_API_KEY set: ${{ secrets.OPENAI_API_KEY != '' && 'YES' || 'NO' }}"

      - name: Initial delay to avoid rate limiting
        run: sleep 15  # Attende 15 secondi prima di iniziare per evitare IP rate limiting

      - name: Run Job Hunter Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          MISTRAL_MODEL: ${{ secrets.MISTRAL_MODEL }}
        run: |
          python job_hunter.py 2>&1 || echo "EXIT_CODE=$?"
